<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Darbandikhan Institute Fee Receipt</title>

<style>
body{
font-family:Arial;
background:#eef2f7;
padding:15px;
}

.container{
max-width:900px;
margin:auto;
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,0.2);
}

.top-bar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

h1{margin:0;color:darkblue;}

.clear-btn{
padding:10px 15px;
background:red;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
width:auto;
display:inline-block;
}

h2{
background:darkblue;
color:white;
padding:10px;
border-radius:8px;
}

label{display:block;margin-top:15px;font-weight:bold;}

input, select{
width:100%;
padding:12px;
margin-top:5px;
border-radius:8px;
border:1px solid #ccc;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
border:none;
border-radius:10px;
font-size:18px;
cursor:pointer;
color:white;
}

.save-btn{background:blue;}
.print-btn{background:green;}
.export-btn{background:#ff6600;}
.search-btn{background:#6a00ff;}

.summary{
margin-top:20px;
background:#f5f9ff;
padding:15px;
border-radius:10px;
}

#receipt{
display:none;
margin-top:30px;
padding:20px;
border:2px solid black;
border-radius:10px;
background:white;
}

table{
width:100%;
margin-top:20px;
border-collapse:collapse;
}

th,td{
border:1px solid #999;
padding:10px;
text-align:center;
}

th{
background:darkblue;
color:white;
}
</style>
</head>

<body>

<div class="container">

<div class="top-bar">
<h1>Darbandikhan Institute Fee Receipt</h1>
<button class="clear-btn" onclick="clearForm()">Clear Form & Data</button>
</div>

<label>Name</label>
<input type="text" id="name">

<label>Phone</label>
<input type="text" id="phone">

<label>Course</label>
<select id="course">
<option value="">Select Course</option>
<option>First Friends 1</option>
<option>Let's Go 2</option>
<option>Let's Go 3</option>
<option>Let's Go 4</option>
<option>Let's Go 5</option>
<option>Let's Go 6</option>
<option>Beginner</option>
<option>Elementary</option>
<option>Pre-Intermediate</option>
<option>Intermediate</option>
<option>Upper-Intermediate</option>
<option>Advanced</option>
</select>

<label>Teacher</label>
<select id="teacher">
<option value="">Select Teacher</option>
<option>Khalid Qubady</option>
<option>Aram Aziz</option>
<option>Livyar</option>
<option>Muhamad</option>
<option>Niyan</option>
</select>

<label>Total Fee</label>
<input type="number" id="totalFee">

<h2>Payments</h2>

<label>1st Amount</label>
<input type="number" id="amount1">
<label>Date</label>
<input type="date" id="date1">

<label>2nd Amount</label>
<input type="number" id="amount2">
<label>Date</label>
<input type="date" id="date2">

<label>3rd Amount</label>
<input type="number" id="amount3">
<label>Date</label>
<input type="date" id="date3">

<div class="summary">
<p id="totalPaid">Total Paid: $0</p>
<p id="remaining">Remaining: $0</p>
</div>

<button class="save-btn" onclick="generateReceipt()">Save Payment</button>

<div id="receipt">
<h2>Receipt</h2>
<p id="r_name"></p>
<p id="r_phone"></p>
<p id="r_course"></p>
<p id="r_teacher"></p>
<p id="r_total"></p>
<hr>
<p id="r_paid"></p>
<p id="r_remaining"></p>
<p id="r_installments"></p>
<button class="print-btn" onclick="window.print()">Print</button>
</div>

<h2>Search</h2>
<input type="text" id="searchInput">
<button class="search-btn" onclick="searchStudent()">Search</button>

<button class="export-btn" onclick="downloadCSV()">Download CSV</button>

<h2>Saved Data</h2>
<table id="paymentsTable">
<tr>
<th>Name</th>
<th>Phone</th>
<th>Course</th>
<th>Teacher</th>
<th>Total</th>
<th>Paid</th>
<th>Remaining</th>
<th>Date</th>
</tr>
</table>

</div>

<script>

window.onload = function(){
let payments = JSON.parse(localStorage.getItem("payments")) || [];
payments.forEach(addRowToTable);
}

function generateReceipt(){

let totalFee = parseFloat(document.getElementById("totalFee").value) || 0;
let a1 = parseFloat(document.getElementById("amount1").value) || 0;
let a2 = parseFloat(document.getElementById("amount2").value) || 0;
let a3 = parseFloat(document.getElementById("amount3").value) || 0;

let totalPaid = a1 + a2 + a3;
let remaining = totalFee - totalPaid;

document.getElementById("totalPaid").innerText = "Total Paid: $" + totalPaid;
document.getElementById("remaining").innerText = "Remaining: $" + remaining;

document.getElementById("receipt").style.display = "block";

let payment = {
name: document.getElementById("name").value || "",
phone: document.getElementById("phone").value || "",
course: document.getElementById("course").value || "",
teacher: document.getElementById("teacher").value || "",
totalFee: totalFee,
paid: totalPaid,
remaining: remaining,
date: new Date().toLocaleDateString()
};

let payments = JSON.parse(localStorage.getItem("payments")) || [];
payments.push(payment);
localStorage.setItem("payments", JSON.stringify(payments));

addRowToTable(payment);
}

function addRowToTable(p){
let table = document.getElementById("paymentsTable");
let row = table.insertRow();

row.insertCell(0).innerText = p.name || "";
row.insertCell(1).innerText = p.phone || "";
row.insertCell(2).innerText = p.course || "";
row.insertCell(3).innerText = p.teacher || "";
row.insertCell(4).innerText = "$" + (p.totalFee || 0);
row.insertCell(5).innerText = "$" + (p.paid || 0);
row.insertCell(6).innerText = "$" + (p.remaining || 0);
row.insertCell(7).innerText = p.date || "";
}

function searchStudent(){
let input = document.getElementById("searchInput").value.toLowerCase();
let rows = document.getElementById("paymentsTable").rows;

for(let i=1;i<rows.length;i++){
let name = rows[i].cells[0].innerText.toLowerCase();
rows[i].style.display = name.includes(input) ? "" : "none";
}
}

function downloadCSV(){
let payments = JSON.parse(localStorage.getItem("payments")) || [];
let csv = "Name,Phone,Course,Teacher,Total,Paid,Remaining,Date\n";

payments.forEach(p=>{
csv += `${p.name},${p.phone},${p.course},${p.teacher},${p.totalFee},${p.paid},${p.remaining},${p.date}\n`;
});

let blob = new Blob([csv], {type:"text/csv"});
let link = document.createElement("a");
link.href = URL.createObjectURL(blob);
link.download = "payments.csv";
link.click();
}

function clearForm(){

document.getElementById("name").value="";
document.getElementById("phone").value="";
document.getElementById("course").value="";
document.getElementById("teacher").value="";
document.getElementById("totalFee").value="";

document.getElementById("amount1").value="";
document.getElementById("amount2").value="";
document.getElementById("amount3").value="";

document.getElementById("date1").value="";
document.getElementById("date2").value="";
document.getElementById("date3").value="";

localStorage.removeItem("payments");

let table = document.getElementById("paymentsTable");
while(table.rows.length > 1){
table.deleteRow(1);
}

document.getElementById("receipt").style.display="none";
}

</script>

</body>
</html>
